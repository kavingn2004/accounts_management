# Netlify build & deploy config for the Flutter web app.
#
# Netlify's build image does not ship with Flutter, so the build command fetches
# a pinned Flutter SDK and then compiles the web release. Supabase credentials
# are injected at build time from Netlify environment variables
# (Site settings -> Environment variables):
#
#   SUPABASE_URL       = https://<project>.supabase.co
#   SUPABASE_ANON_KEY  = <anon public key>
#   GROQ_API_KEY       = <key for the Ask proxy; read only by the function>
#
# When those are absent the app falls back to on-device storage (no login) and
# Ask falls back to keyword routing, so a deploy without them still works.

[build]
  publish = "build/web"
  command = '''
    set -e
    if [ ! -d "$HOME/flutter/bin" ]; then
      git clone https://github.com/flutter/flutter.git --branch "$FLUTTER_VERSION" --depth 1 "$HOME/flutter"
    fi
    export PATH="$HOME/flutter/bin:$PATH"
    flutter --version
    flutter config --enable-web
    flutter pub get
    flutter build web --release \
      --dart-define=SUPABASE_URL="$SUPABASE_URL" \
      --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
      --dart-define=ASK_LLM_URL="${ASK_LLM_URL:-/api}" \
      --dart-define=ASK_LLM_MODEL=""
  '''

# The Ask proxy lives here; Netlify finds and deploys it with the site.
[functions]
  directory = "netlify/functions"

[build.environment]
  # Pin to the same stable Flutter the project is developed against. Keep this
  # equal to the local SDK (`flutter --version`) — the app is only ever tested
  # against that one, and a CI-only version skew is a miserable thing to debug.
  FLUTTER_VERSION = "3.44.8"

# Ask's model proxy. The app is built with ASK_LLM_URL=/api and its client
# appends /chat/completions, so this is the address it posts to. It must stay
# above the SPA fallback: the first matching rule wins, and /* matches
# everything — a question would otherwise be answered with index.html.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/ask-llm"
  status = 200

# SPA fallback: every path serves the Flutter app shell. This is also provided
# by web/_redirects (copied into build/web); declared here too for visibility.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
