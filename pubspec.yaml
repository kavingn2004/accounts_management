name: accounts_app
description: Personal accounts management app (income, expenses, savings, investments, debts, bills).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  # State management
  flutter_riverpod: ^2.5.1

  # On-device PIN: secure keychain storage + hashing
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Currency / date formatting
  intl: ^0.19.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5

  # Export (CSV / PDF) for income & expenses
  pdf: ^3.11.1
  share_plus: ^10.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/logo.png"
  remove_alpha_ios: true
  background_color_ios: "#0D47A1"
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/icon/logo.png"
  web:
    generate: true
    image_path: "assets/icon/logo.png"
    background_color: "#0D47A1"
    theme_color: "#1565C0"
