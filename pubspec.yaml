name: accounts_app
description: Personal accounts management app (income, expenses, savings, investments, debts, bills).
publish_to: "none"
version: 0.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.5.1

  # On-device PIN: secure keychain storage + hashing
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Currency / date formatting
  intl: ^0.19.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5

  # Export (CSV / PDF) for income & expenses
  pdf: ^3.11.1
  share_plus: ^10.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  # Bundled as static TTFs (not google_fonts) so the app renders offline and
  # never fetches a typeface at first paint.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/logo.png"
  remove_alpha_ios: true
  # Palette per design 1i — "ivory on clay". The old #0D47A1 blue is gone.
  background_color_ios: "#B85536"
  adaptive_icon_background: "#F5F1EB"
  adaptive_icon_foreground: "assets/icon/logo.png"
  web:
    generate: true
    image_path: "assets/icon/logo.png"
    background_color: "#F5F1EB"
    theme_color: "#B85536"
