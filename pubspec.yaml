name: accounts_app
description: Personal accounts management app (income, expenses, savings, investments, debts, bills).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  # State management
  flutter_riverpod: ^2.5.1

  # On-device PIN: secure keychain storage + hashing
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Currency / date formatting
  intl: ^0.19.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
